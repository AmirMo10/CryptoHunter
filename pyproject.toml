[project]
name = "cryptohunter"
version = "0.1.0"
description = "Research and trading system for crypto perpetual-futures strategies"
requires-python = ">=3.11"
readme = "CLAUDE.md"
dependencies = [
    "polars>=1.12",
    "pyarrow>=17",
    "httpx[http2]>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "python-dateutil>=2.9",
]

[project.scripts]
cryptohunter = "cryptohunter.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptohunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "ASYNC"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF005", "RUF007"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
